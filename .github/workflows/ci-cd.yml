name: PERN App CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1 - UNIT TESTS / LINT
  # ============================================================

  unit-tests:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ========================================================
      # BACKEND
      # ========================================================

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Test Check
        working-directory: backend
        run: |
          echo "Checking backend test script..."

          if npm run | grep -q "test"; then
            echo "Backend test script found."
            npm test
          else
            echo "Backend does not have a test script."
            echo "Skipping backend unit tests."
          fi

      # ========================================================
      # FRONTEND
      # ========================================================

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint


  # ============================================================
  # JOB 2 - SONARCLOUD
  # ============================================================

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # SonarCloud Scan
      # --------------------------------------------------------

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --------------------------------------------------------
      # SonarCloud Summary
      # --------------------------------------------------------

      - name: SonarCloud Summary
        run: |
          echo "======================================"
          echo "SonarCloud analysis completed"
          echo "======================================"
          echo "Organization: singhvipul2200"
          echo "Project Key: singhvipul2200_pern-k8s-github-actions"
          echo "Quality Gate was checked."
          echo "======================================"


  # ============================================================
  # JOB 3 - BUILD & PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build & Push Docker Images
    needs:
      - unit-tests
      - sonarcloud

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ========================================================
      # BACKEND IMAGE
      # ========================================================

      - name: Build & Push Backend Image
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            vipulsingh2200/pern-backend:latest
            vipulsingh2200/pern-backend:${{ github.sha }}

      # ========================================================
      # FRONTEND IMAGE
      # ========================================================

      - name: Build & Push Frontend Image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true

          tags: |
            vipulsingh2200/pern-frontend:latest
            vipulsingh2200/pern-frontend:${{ github.sha }}

          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_IMAGEKIT_URL_ENDPOINT=${{ vars.VITE_IMAGEKIT_URL_ENDPOINT }}

      # ========================================================
      # DOCKER BUILD SUMMARY
      # ========================================================

      - name: Docker Build Summary
        run: |
          echo "======================================"
          echo "Docker images built successfully"
          echo "======================================"

          echo ""
          echo "Backend:"
          echo "vipulsingh2200/pern-backend:latest"
          echo "vipulsingh2200/pern-backend:${{ github.sha }}"

          echo ""
          echo "Frontend:"
          echo "vipulsingh2200/pern-frontend:latest"
          echo "vipulsingh2200/pern-frontend:${{ github.sha }}"

          echo ""
          echo "Backend Digest:"
          echo "${{ steps.backend-build.outputs.digest }}"

          echo ""
          echo "Frontend Digest:"
          echo "${{ steps.frontend-build.outputs.digest }}"

          echo ""
          echo "======================================"
          echo "Docker push completed"
          echo "======================================"


  # ============================================================
  # JOB 4 - DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy PERN App to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Add EC2 Host to known_hosts
      # --------------------------------------------------------

      - name: Add EC2 Host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # SSH Deployment
      # --------------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting PERN deployment"
            echo "======================================"

            cd ~/pern-k8s-github-actions

            echo ""
            echo "Current directory:"
            pwd

            # ==================================================
            # Pull Latest Docker Images
            # ==================================================

            echo ""
            echo "======================================"
            echo "Pulling latest Docker images"
            echo "======================================"

            docker pull vipulsingh2200/pern-backend:latest
            docker pull vipulsingh2200/pern-frontend:latest

            # ==================================================
            # Stop Existing Containers
            # ==================================================

            echo ""
            echo "======================================"
            echo "Stopping old containers"
            echo "======================================"

            docker compose down || true

            # ==================================================
            # Start New Containers
            # ==================================================

            echo ""
            echo "======================================"
            echo "Starting new containers"
            echo "======================================"

            docker compose up -d

            # ==================================================
            # Remove Unused Images
            # ==================================================

            echo ""
            echo "======================================"
            echo "Removing unused Docker images"
            echo "======================================"

            docker image prune -f

            # ==================================================
            # Deployment Status
            # ==================================================

            echo ""
            echo "======================================"
            echo "Deployment completed successfully"
            echo "======================================"

            echo ""
            echo "Running containers:"
            docker ps

            echo ""
            echo "Docker Compose status:"
            docker compose ps
