name: PERN Store CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1 - UNIT TESTS / LINT
  # ============================================================

  unit-tests:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # -------------------------
      # Backend
      # -------------------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Test Check
        working-directory: backend
        run: |
          echo "Backend does not have a test script."
          echo "Skipping backend unit tests."

      # -------------------------
      # Frontend
      # -------------------------

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint


  # ============================================================
  # JOB 2 - SONARCLOUD
  # ============================================================

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # JOB 3 - BUILD & PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build & Push Docker Images
    needs:
      - unit-tests
      - sonarcloud

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Docker Buildx
      # -------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # Docker Hub Login
      # -------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ========================================================
      # BACKEND IMAGE
      # (no build-args needed — backend reads all config from
      # runtime env vars / --env-file, not baked in at build time)
      # ========================================================

      - name: Build & Push Backend Image
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            vipulsingh2200/pern-backend:latest
            vipulsingh2200/pern-backend:${{ github.sha }}

      # ========================================================
      # FRONTEND IMAGE
      # (VITE_* vars ARE build-args — Vite bakes them into the
      # JS bundle at build time, so they must be set here, not
      # as normal env vars on the running container)
      # ========================================================

      - name: Build & Push Frontend Image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            vipulsingh2200/pern-frontend:latest
            vipulsingh2200/pern-frontend:${{ github.sha }}

          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_IMAGEKIT_URL_ENDPOINT=${{ vars.VITE_IMAGEKIT_URL_ENDPOINT }}

      # -------------------------
      # Build Summary
      # -------------------------

      - name: Docker Build Summary
        run: |
          echo "======================================"
          echo "Docker images built successfully"
          echo "======================================"

          echo "Backend:"
          echo "vipulsingh2200/pern-backend:latest"
          echo "vipulsingh2200/pern-backend:${{ github.sha }}"

          echo ""

          echo "Frontend:"
          echo "vipulsingh2200/pern-frontend:latest"
          echo "vipulsingh2200/pern-frontend:${{ github.sha }}"

          echo ""

          echo "Backend Digest:"
          echo "${{ steps.backend-build.outputs.digest }}"

          echo ""

          echo "Frontend Digest:"
          echo "${{ steps.frontend-build.outputs.digest }}"


  # ============================================================
  # JOB 4 - DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Add EC2 host to known_hosts
      # Prevents interactive SSH confirmation
      # --------------------------------------------------------

      - name: Add EC2 Host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # --------------------------------------------------------
      # SSH Deployment
      # --------------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            cd ~/pern-store

            echo "Current directory:"
            pwd

            echo ""
            echo "Pulling latest Docker images..."

            docker pull vipulsingh2200/pern-backend:latest
            docker pull vipulsingh2200/pern-frontend:latest

            echo ""
            echo "Stopping old containers..."

            docker compose down || true

            echo ""
            echo "Starting new containers..."

            docker compose up -d

            echo ""
            echo "Removing unused Docker images..."

            docker image prune -f

            echo ""
            echo "======================================"
            echo "Deployment completed"
            echo "======================================"

            echo ""
            echo "Running containers:"
            docker ps
