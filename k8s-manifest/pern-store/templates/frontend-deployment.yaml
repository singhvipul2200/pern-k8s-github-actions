apiVersion: apps/v1
kind: Deployment
metadata:
  name: pern-frontend
  labels:
    app: pern-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: pern-frontend
  template:
    metadata:
      labels:
        app: pern-frontend
    spec:
      containers:
        - name: pern-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
